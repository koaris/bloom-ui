name: Release

# Every push to main versions any pending changesets, commits the version bump
# back to main, and publishes the new versions to npm. There is no
# "Version Packages" pull request.
on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci

      - name: Version packages
        id: version
        run: |
          npx changeset version
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            # changeset version leaves the lockfile alone, but it records
            # workspace versions, so sync it before committing
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit version bump
        if: steps.version.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(release): version packages [skip ci]'
          git push origin HEAD:main

      # Publishes every package whose version is not on npm yet, so a failed
      # publish is retried automatically by the next push.
      - name: Publish to npm
        run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

      - name: Push release tags
        run: git push origin --tags
